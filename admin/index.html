<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=search] {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); font: inherit; min-width: 180px;
    }
    .last { font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
    .last b { color: var(--text); font-weight: 600; }
    .last.stale b { color: var(--building); }
    .last.never b { color: var(--planned); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Admin Hub</h1>
        <p id="summary"></p>
      </div>
      <div class="controls">
        <input type="search" id="q" placeholder="Search…" aria-label="Search projects" />
        <button class="btn" id="sort" aria-pressed="false" title="Show the projects you haven't checked in the longest first">Least recently checked</button>
      </div>
    </header>

    <section class="grid" id="grid"></section>
    <footer><a href="/">Public portfolio</a> · last-checked times are saved in this browser</footer>
  </main>

  <script src="/sites.js"></script>
  <script src="/admin/private.js"></script>
  <script>
    const PRIV = window.PRIVATE || {};
    const sites = window.HUB.sites.map((s) => ({ ...s, ...PRIV[s.name], links: [...(s.links || []), ...(PRIV[s.name]?.links || [])] }));
    const LABEL = { live: "Live", building: "Building", planned: "Planned", showcase: "Case study" };
    const STALE_DAYS = 7;
    const KEY = "hub:lastAdmin";
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ext = (href) => /^https?:/.test(href) ? ` target="_blank" rel="noopener"` : "";

    // { [project name]: ISO timestamp of the last click-through to its admin page }
    let last = {};
    try { last = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(last)); } catch {} };

    const fmt = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    function ago(d) {
      const mins = Math.round((Date.now() - d) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hr ago`;
      const days = Math.round(hrs / 24);
      return `${days} day${days === 1 ? "" : "s"} ago`;
    }
    const isStale = (iso) => !iso || Date.now() - new Date(iso) > STALE_DAYS * 864e5;

    function card(s) {
      const host = s.url && /^https?:/.test(s.url) ? new URL(s.url).host : s.url ? "Hosted on this site" : "Not deployed yet";
      const actions = [
        s.admin && `<a class="primary" data-admin="${esc(s.name)}" href="${esc(s.admin)}" target="_blank" rel="noopener">Admin</a>`,
        s.url && `<a${s.admin ? "" : ' class="primary"'} href="${esc(s.url)}"${ext(s.url)}>${s.status === "showcase" ? "View" : "Site"}</a>`,
        s.demo && `<a href="${esc(s.demo)}" target="_blank" rel="noopener">Demo</a>`,
        s.writeup && `<a href="${esc(s.writeup)}"${ext(s.writeup)}>Write-up</a>`,
        ...s.links.map((l) => `<a href="${esc(l.href)}"${ext(l.href)}>${esc(l.label)}</a>`),
        s.repo && `<a href="${esc(s.repo)}" target="_blank" rel="noopener">Code</a>`,
      ].filter(Boolean).join("");

      let lastLine = "";
      if (s.admin) {
        const iso = last[s.name];
        lastLine = iso
          ? `<div class="last${isStale(iso) ? " stale" : ""}">Last checked <b>${fmt.format(new Date(iso))}</b> · ${ago(new Date(iso))}</div>`
          : `<div class="last never">Last checked <b>never</b> (from this browser)</div>`;
      }
      return `
        <article class="card">
          <div class="card-top">
            <h2>${esc(s.name)}</h2>
            <span class="badge ${s.status}">${LABEL[s.status] || s.status}</span>
          </div>
          <p>${esc(s.description || "")}</p>
          <div class="meta">${/^https?:/.test(s.url || "") ? `<span class="dot" data-ping="${esc(s.url)}" title="Checking…"></span>` : ""}${esc(host)}${s.public === false ? " · hidden from public" : ""}</div>
          <div class="actions">${actions}</div>
          ${lastLine}
        </article>`;
    }

    let byLast = false;
    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      let list = sites.filter((s) => !q || [s.name, s.description, ...(s.tags || [])].join(" ").toLowerCase().includes(q));
      if (byLast) {
        // Admin pages first, oldest check (or never) first; everything else after.
        const t = (s) => (s.admin ? (last[s.name] ? Date.parse(last[s.name]) : 0) : Infinity);
        list = [...list].sort((a, b) => t(a) - t(b));
      }
      document.getElementById("grid").innerHTML = list.map(card).join("") || `<div class="empty">No matches.</div>`;
      document.querySelectorAll("[data-ping]").forEach(ping);

      const admins = sites.filter((s) => s.admin);
      const due = admins.filter((s) => isStale(last[s.name])).length;
      document.getElementById("summary").textContent =
        `${sites.length} projects · ${admins.length} admin pages · ${due ? `${due} not checked in ${STALE_DAYS}+ days` : "all checked this week"}`;
    }

    // Record a click-through (left, middle or ctrl/cmd click) to an admin page.
    function record(e) {
      const a = e.target.closest("[data-admin]");
      if (!a) return;
      last[a.dataset.admin] = new Date().toISOString();
      save();
      setTimeout(render, 0);
    }
    document.addEventListener("click", record);
    document.addEventListener("auxclick", (e) => e.button === 1 && record(e));

    // Reachability: a no-cors request resolves if the site answers at all.
    const pingCache = {};
    function ping(dot) {
      const url = dot.dataset.ping;
      pingCache[url] ??= Promise.race([
        fetch(url, { mode: "no-cors", cache: "no-store" }).then(() => true),
        new Promise((r) => setTimeout(() => r(false), 8000)),
      ]).catch(() => false);
      pingCache[url].then((up) => {
        dot.classList.add(up ? "up" : "down");
        dot.title = up ? "Reachable" : "Not responding";
      });
    }

    document.getElementById("q").addEventListener("input", render);
    document.getElementById("sort").addEventListener("click", (e) => {
      byLast = !byLast;
      e.currentTarget.setAttribute("aria-pressed", byLast);
      render();
    });
    // Keep the "x min ago" labels fresh when coming back to the tab.
    document.addEventListener("visibilitychange", () => !document.hidden && render());
    render();
  </script>
</body>
</html>
