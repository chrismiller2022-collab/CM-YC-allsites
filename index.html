<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chris Miller · Projects</title>
  <meta name="description" content="Web apps and tools designed and built by Chris Miller." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .hero { margin-bottom: 28px; }
    .hero p { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
    .hero .links { margin-top: 10px; font-size: 14px; display: flex; gap: 14px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .owner { color: var(--muted); opacity: .6; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1 id="title"></h1>
      <p id="tagline"></p>
      <div class="links"><a id="gh" target="_blank" rel="noopener">GitHub</a></div>
    </header>

    <div class="filters" role="group" aria-label="Filter projects">
      <button class="btn" data-f="all" aria-pressed="true">All</button>
      <button class="btn" data-f="apps" aria-pressed="false">Web apps</button>
      <button class="btn" data-f="showcase" aria-pressed="false">Case studies</button>
    </div>

    <section class="grid" id="grid"></section>
    <footer><a class="owner" href="/admin">Owner</a></footer>
  </main>

  <script src="/sites.js"></script>
  <script>
    const hub = window.HUB;
    const LABEL = { live: "Live", building: "In progress", planned: "Planned", showcase: "Case study" };
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ext = (href) => /^https?:/.test(href) ? ` target="_blank" rel="noopener"` : "";
    const btn = (label, href, primary) => `<a${primary ? ' class="primary"' : ""} href="${esc(href)}"${ext(href)}>${esc(label)}</a>`;

    // Public = not opted out, and has something a visitor can actually open.
    const sites = hub.sites.filter((s) => s.public !== false && (s.url || s.demo || s.writeup));

    document.getElementById("title").textContent = `${hub.owner} · Projects`;
    document.getElementById("tagline").textContent = hub.tagline;
    document.getElementById("gh").href = hub.github;

    function card(s) {
      const actions = [
        s.url && btn(s.status === "showcase" ? "Read" : "Visit site", s.url, true),
        s.demo && btn("Demo", s.demo),
        s.writeup && btn("Write-up", s.writeup),
        ...(s.links || []).map((l) => btn(l.label, l.href)),
        s.repo && !s.repoPrivate && btn("Code", s.repo),
      ].filter(Boolean).join("");
      return `
        <article class="card">
          <div class="card-top">
            <h2>${esc(s.name)}</h2>
            <span class="badge ${s.status}">${LABEL[s.status] || s.status}</span>
          </div>
          <p>${esc(s.description || "")}</p>
          ${s.tags?.length ? `<div class="tags">${s.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          <div class="actions">${actions}</div>
        </article>`;
    }

    let filter = "all";
    function render() {
      const list = sites.filter((s) =>
        filter === "all" || (filter === "showcase" ? s.status === "showcase" : s.status !== "showcase"));
      document.getElementById("grid").innerHTML = list.map(card).join("") || `<div class="empty">Nothing here yet.</div>`;
    }
    document.querySelectorAll(".filters .btn").forEach((b) =>
      b.addEventListener("click", () => {
        filter = b.dataset.f;
        document.querySelectorAll(".filters .btn").forEach((x) => x.setAttribute("aria-pressed", x === b));
        render();
      })
    );
    render();
  </script>
</body>
</html>
